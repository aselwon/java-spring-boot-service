spring:
  application:
    name: orderhub
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/orderhub}
    username: ${DB_USER:orderhub}
    password: ${DB_PASSWORD:orderhub-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
server:
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
orderhub:
  user-password: ${USER_PASSWORD:user-local}
  admin-password: ${ADMIN_PASSWORD:admin-local}
